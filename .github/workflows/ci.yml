name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php:
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl
          coverage: none

      - run: composer install --no-interaction --no-progress

      - run: vendor/bin/phpunit

  phar:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: box
          coverage: none

      - run: composer install --no-interaction --no-progress --no-dev --optimize-autoloader

      - run: box compile

      - run: php build/wallabin.phar --version

      - uses: actions/upload-artifact@v4
        with:
          name: wallabin.phar
          path: build/wallabin.phar
