name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  phar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: box
          coverage: none

      - run: composer install --no-interaction --no-progress --no-dev --optimize-autoloader

      - run: box compile

      - run: php build/wallabin.phar --version

      - run: |
          sudo apt-get update -q && sudo apt-get install -yq minisign
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          minisign -S -s "$RUNNER_TEMP/minisign.key" -m build/wallabin.phar -t "wallabin $TAG"
          rm "$RUNNER_TEMP/minisign.key"
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          TAG: ${{ github.event.release.tag_name }}

      - run: gh release upload "$TAG" build/wallabin.phar build/wallabin.phar.minisig --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
