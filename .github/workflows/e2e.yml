name: End-to-end

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      wallabag-ref:
        description: 'wallabag branch or tag to build the 2.7 package from'
        required: false

env:
  WALLABAG_26: '2.6.18'
  WALLABAG_REF: ${{ inputs.wallabag-ref || 'release-package-for-wallabin' }}

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: wallabag/wallabag
          ref: ${{ env.WALLABAG_REF }}

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: curl, gd, intl, pdo_sqlite, tidy
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - run: make release VERSION="$WALLABAG_REF"

      - run: |
          mkdir packages
          mv "/tmp/wllbg-release/wallabag-$WALLABAG_REF.tar.gz" packages/wallabag-2.7.tar.gz
          curl -sSfL -o packages/wallabag-2.6.tar.gz "https://github.com/wallabag/wallabag/releases/download/$WALLABAG_26/wallabag-$WALLABAG_26.tar.gz"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages
          path: packages
          retention-days: 1

  e2e:
    runs-on: ubuntu-latest
    needs: packages

    strategy:
      fail-fast: false
      matrix:
        database:
          - sqlite
          - mysql
          - pgsql

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd=pg_isready --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: curl, gd, intl, pdo_mysql, pdo_pgsql, pdo_sqlite, tidy
          coverage: none

      - run: composer install --no-interaction --no-progress --no-dev

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages
          path: packages

      - run: tests/e2e/run.sh packages/wallabag-2.6.tar.gz packages/wallabag-2.7.tar.gz
        env:
          DATABASE: ${{ matrix.database }}
          DB_PASSWORD: ${{ matrix.database == 'mysql' && 'root' || 'postgres' }}
